apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
  namespace: travel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
      - name: nextjs
        image: travel-api/nextjs:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: DOTNET_URL
          value: "http://dotnet-service:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-service
  namespace: travel-api
spec:
  selector:
    app: nextjs
  ports:
  - port: 3000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs
  namespace: travel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
    spec:
      containers:
      - name: nodejs
        image: travel-api/nodejs:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 4000
        env:
        - name: NEXTJS_URL
          value: "http://nextjs-service:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-service
  namespace: travel-api
spec:
  selector:
    app: nodejs
  ports:
  - port: 4000

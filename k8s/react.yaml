apiVersion: apps/v1
kind: Deployment
metadata:
  name: react
  namespace: travel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
      - name: react
        image: travel-api/react:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-service
  namespace: travel-api
spec:
  selector:
    app: react
  ports:
  - port: 80

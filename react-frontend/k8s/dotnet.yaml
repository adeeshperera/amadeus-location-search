apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet
  namespace: travel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet
  template:
    metadata:
      labels:
        app: dotnet
    spec:
      containers:
      - name: dotnet
        image: travel-api/dotnet:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: Redis__ConnectionString
          value: "redis-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-service
  namespace: travel-api
spec:
  selector:
    app: dotnet
  ports:
  - port: 5000
